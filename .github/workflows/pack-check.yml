# 요청(PR)이 오면 팩 검사, 전체 시험, 빌드를 돌린다. 비밀값을 쓰지 않는다(남이 보낸 코드가 도는 자리다).
name: 팩 검사
on:
  pull_request:
  workflow_dispatch:   # '승인된 팩 싣기'가 자기가 연 요청의 가지에서 직접 돌린다
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 스테이지가 많은 팩은 봇 시험(스테이지 × 2·8·30명)만 10분을 넘긴다(josa-crossroads 실측)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:packs
      - run: npm test
      - run: npm run build
      - run: npm run check:security   # 도름스체크(코드만). 걸린 것이 있으면 멈춘다
